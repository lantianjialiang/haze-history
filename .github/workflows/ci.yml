name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck and web build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore local data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: |
            data/quotsoft-history.sqlite
            data/haze.sqlite
          key: haze-data-${{ hashFiles('data/cities-overview.json', 'server/quotsoft.ts') }}-v1
          restore-keys: |
            haze-data-

      - name: Install Git LFS
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Build history database
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          npm run data:cn-air
          HISTORY_SKIP_REMOTE=1 npm run history -- --national
        env:
          NODE_OPTIONS: --experimental-sqlite

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7